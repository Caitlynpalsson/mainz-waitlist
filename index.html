<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#14213D;font:13px/1.6 Inter,sans-serif;-webkit-font-smoothing:antialiased;text-align:center}
main{max-width:340px;margin:0 auto;padding:72px 24px 48px}
.lock{position:relative;display:inline-block;text-align:left;padding-left:12px}
.hb{font-weight:800;letter-spacing:-.055em;line-height:.9;font-size:30px}

</style></head><body><main>
<div class="lock"><div class="hb">LOVE<br>LIVING:</div><div class="hb ainz">AINZ</div><span class="m">M</span></div>
<div class="s"><p>know your farmer.</p><p>real food. straight from the farm.</p><p>no middleman.</p></div>
<img src="p.jpg" alt="">
<p>we make the luxury of eating clean accessible.</p>
<p class="dim">utah first. launching soon.</p>
<form id="f">
<input type="hidden" name="_subject" value="mainz waitlist signup"><input type="hidden" name="_template" value="table"><input type="text" name="_honey" style="display:none">

</main><script>
f.onsubmit=async e=>{e.preventDefault();b.disabled=1;b.textContent='...';

try{const r=await fetch('https://formsubmit.co/ajax/6dc0c7989bc6fabb14a262372dd6f013',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(d)});
