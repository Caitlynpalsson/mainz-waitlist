name = "mainz-assistant"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Static staff dashboard. The worker handles /api first, then assets.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Phase 2 weekly rhythm is intentionally not scheduled.
# Mon check, Tue one follow-up, Wed escalate to a phone call,
# Thu orders close with one summary per farm, Fri pickup confirmation.
# [triggers]
# crons = ["0 16 * * 1-5"]

[[d1_databases]]
binding = "DB"
database_name = "mainz-assistant"
# Placeholder. Replace with the id printed by `wrangler d1 create mainz-assistant`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[dev]
port = 8787
